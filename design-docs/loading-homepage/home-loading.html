<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RekanMU Home: loading</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{--ground:#F6F8FA;--ink:#0E1116;--blue:#3179CB;--gut:clamp(20px,3.4vw,48px);--s:min(40svh,30vw);--soft:cubic-bezier(.2,.7,.2,1)}
html{background:var(--ground)}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"Geist",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.stage{position:relative;height:100svh;min-height:520px;overflow:hidden;touch-action:pan-y}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

/* header: absent while loading, arrives with the headline */
.head{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:20px var(--gut);pointer-events:none;opacity:0;transform:translateY(-10px);transition:opacity .9s var(--soft),transform 1s var(--soft)}
.ready .head{opacity:1;transform:none}
.brand{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:500;letter-spacing:-.02em}
.brand img{width:32px;height:32px;display:block}
.hdr{display:flex;align-items:center;gap:28px;font-size:16px;font-weight:500}
.hdr span{font:400 12px "Geist Mono",ui-monospace,monospace;letter-spacing:.04em}
.hdr i{display:inline-block;width:22px;height:8px;border-top:1.5px solid currentColor;border-bottom:1.5px solid currentColor;margin-left:10px}

/* the square sits exactly where the hero's logo square sits; the solid logo fades in over the points */
.sq{position:absolute;left:calc(68vw - var(--s) / 2);top:calc(63svh - var(--s) / 2);width:var(--s);height:var(--s);pointer-events:none}
.sq img{display:block;width:100%;height:100%;opacity:0;transition:opacity .6s var(--soft)}
.merge .sq img{opacity:1}

/* the headline arrives one line after the other, then the button */
h1{position:absolute;left:var(--gut);top:clamp(96px,13vh,150px);margin:0;width:calc(68vw - var(--s) / 2 - var(--gut) - 20px);font-weight:500;letter-spacing:-.05em;line-height:.9;font-size:min(9.2vw,13.4svh);pointer-events:none}
h1 span{display:block;opacity:0;transform:translateY(16px);transition:opacity .9s var(--soft),transform 1s var(--soft)}
h1 .pt{color:transparent;background-image:radial-gradient(circle at center,#0E1116 0 1.3px,transparent 1.7px);background-size:5px 5px;-webkit-background-clip:text;background-clip:text;transition-delay:.16s}
.ready h1 span{opacity:1;transform:none}
.cta{position:absolute;left:var(--gut);display:inline-flex;align-items:center;min-height:56px;padding:0 30px;border:1.5px solid currentColor;border-radius:999px;font-size:18px;font-weight:500;opacity:0;transform:translateY(12px);transition:opacity .9s var(--soft) .34s,transform 1s var(--soft) .34s}
.ready .cta{opacity:1;transform:none}

@media (max-width:900px),(max-aspect-ratio:4/5){:root{--s:min(56vw,34svh)}.sq{left:calc(50vw - var(--s) / 2);top:calc(64svh - var(--s) / 2)}.hdr span{display:none}h1{width:auto;right:var(--gut);top:clamp(84px,12vh,120px);font-size:min(13.5vw,9svh)}.cta{display:none}}
</style>
</head>
<body>
<section class="stage loading" id="hero">
  <canvas aria-hidden="true"></canvas>
  <div class="head"><div class="brand"><img src="../assets/logo/logo-rekanmu.png" alt="RekanMU mark">RekanMU</div><div class="hdr"><span>EN / ID</span><div>Menu<i></i></div></div></div>
  <h1><span>Beyond Technology.</span><span class="pt">Building Strategic Industries.</span></h1>
  <a class="cta" id="cta">About RekanMU</a>
  <div class="sq"><img id="mark" src="../assets/logo/logo-rekanmu.png" alt=""></div>
</section>
<script src="home-loading.source.js"></script>
<script>
/* This page stands in for Home. It pretends to load for five seconds, shows the result, then starts again.
   On the real page, setProgress() is fed by the real loading of the scene and finish() is called when the scene can draw. */
(function(){
  var root=document.getElementById('hero'),mark=document.getElementById('mark'),cta=document.getElementById('cta'),loader=null;
  function place(){var r=root.getBoundingClientRect(),h=root.querySelector('h1').getBoundingClientRect();cta.style.top=(h.bottom-r.top+30)+'px';}
  function run(){
    root.classList.remove('merge','ready');root.classList.add('loading');root.querySelector('canvas').style.opacity=1;place();
    loader=createHomeLoading({root:root,canvas:root.querySelector('canvas'),square:root.querySelector('.sq'),logo:mark});
    var t0=performance.now(),id=setInterval(function(){var p=(performance.now()-t0)/5000;loader.setProgress(p);if(p>=1){clearInterval(id);loader.finish(function(){setTimeout(run,3500);});}},100);
    window.__load={loader:loader,cls:function(){return root.className;}};
  }
  function go(){(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(run);}
  if(mark.complete&&mark.naturalWidth){go();}else{mark.onload=go;}
  window.addEventListener('resize',place);
})();
</script>
</body>
</html>
